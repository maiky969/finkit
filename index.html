<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Finkit</title>
    <meta name="description" content="Finkit — личные финансы: бюджет, цели и долги в одном месте" />
    <meta name="theme-color" content="#dce7f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121a26" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Finkit" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="preload" href="fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Тема ставится до отрисовки, чтобы ночью экран не мигал светлым
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('finkit:v1') || '{}');
          if (saved.theme === 'light' || saved.theme === 'dark') {
            document.documentElement.setAttribute('data-theme', saved.theme);
          }
          if (saved.lang === 'en') document.documentElement.lang = 'en';
        } catch (error) {}
      })();
    </script>
  </head>
  <body class="intro-run">
    <!-- Иконки: один набор, линия 1.75, скруглённые концы -->
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z" /></symbol>
      <symbol id="i-overview" viewBox="0 0 24 24"><path d="M4 20h16" /><path d="M7 16v-5M12 16V7M17 16v-8" /></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-goals" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><circle cx="12" cy="12" r="4" /><path d="M12 12h.01" /></symbol>
      <symbol id="i-debts" viewBox="0 0 24 24"><path d="M4 9.5 12 5l8 4.5" /><path d="M6 10.5v6.5M10 10.5v6.5M14 10.5v6.5M18 10.5v6.5" /><path d="M4 19.5h16" /></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9M18 7h2M4 17h3M12 17h8" /><circle cx="15.5" cy="7" r="2.25" /><circle cx="9.5" cy="17" r="2.25" /></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" /></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" /></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="m9.5 5.5 6.5 6.5-6.5 6.5" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" /></symbol>
      <symbol id="i-plane" viewBox="0 0 24 24"><path d="M20.5 12c0-.75-.6-1.25-1.4-1.25h-4.3L10.5 4.5H8.7l2.1 6.25H6.6L5 8.7H3.6l.9 3.3-.9 3.3H5l1.6-2.05h4.2L8.7 19.5h1.8l4.3-6.25h4.3c.8 0 1.4-.5 1.4-1.25z" /></symbol>
      <symbol id="i-backspace" viewBox="0 0 24 24"><path d="M9 5.5h10a1.5 1.5 0 0 1 1.5 1.5v10a1.5 1.5 0 0 1-1.5 1.5H9L3.5 12z" /><path d="m11.5 9.5 5 5M16.5 9.5l-5 5" /></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="2.5" /><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4" /></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 19h3.5L19 8.5 15.5 5 5 15.5z" /><path d="m13.5 7 3.5 3.5" /></symbol>
      <symbol id="i-in" viewBox="0 0 24 24"><path d="M17 7 7 17" /><path d="M7 9v8h8" /></symbol>
      <symbol id="i-out" viewBox="0 0 24 24"><path d="M7 17 17 7" /><path d="M9 7h8v8" /></symbol>

      <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14" /></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 19.5h14" /></symbol>
      <!-- Категории -->
      <symbol id="c-cart" viewBox="0 0 24 24"><path d="M3.5 5h2l2 10h10l2-7H7" /><circle cx="9.5" cy="19" r="1.3" /><circle cx="16.5" cy="19" r="1.3" /></symbol>
      <symbol id="c-cup" viewBox="0 0 24 24"><path d="M5 9.5h11v4.5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z" /><path d="M16 11h1.25a2.5 2.5 0 0 1 0 5H16" /><path d="M9 3.5c-.8 1 .8 2 0 3.5M12.5 3.5c-.8 1 .8 2 0 3.5" /></symbol>
      <symbol id="c-car" viewBox="0 0 24 24"><path d="M4.5 16v-3.5L6.6 7h10.8l2.1 5.5V16z" /><path d="M4.5 12.5h15" /><path d="M6.5 16v2.5M17.5 16v2.5" /><path d="M7.5 14.25h.01M16.5 14.25h.01" /></symbol>
      <symbol id="c-house" viewBox="0 0 24 24"><path d="M4 11 12 4.5 20 11" /><path d="M6 9.5V20h12V9.5" /><path d="M10 20v-5h4v5" /></symbol>
      <symbol id="c-phone" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2.5" /><path d="M11 17.5h2" /></symbol>
      <symbol id="c-heart" viewBox="0 0 24 24"><path d="M12 19.5s-7.5-4.4-7.5-10A4 4 0 0 1 12 7.2a4 4 0 0 1 7.5 2.3c0 5.6-7.5 10-7.5 10z" /></symbol>
      <symbol id="c-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z" /><path d="M9 10V7a3 3 0 0 1 6 0v3" /></symbol>
      <symbol id="c-ticket" viewBox="0 0 24 24"><path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z" /><path d="M14 8.5v1.5M14 11.25v1.5M14 14v1.5" /></symbol>
      <symbol id="c-suitcase" viewBox="0 0 24 24"><rect x="4" y="7.5" width="16" height="12" rx="2" /><path d="M9 7.5v-2h6v2M9 7.5v12M15 7.5v12" /></symbol>
      <symbol id="c-transfer" viewBox="0 0 24 24"><path d="M5 8.5h13l-3-3M19 15.5H6l3 3" /></symbol>
      <symbol id="c-bank" viewBox="0 0 24 24"><path d="M4 9.5 12 5l8 4.5" /><path d="M6 10.5v6.5M10 10.5v6.5M14 10.5v6.5M18 10.5v6.5" /><path d="M4 19.5h16" /></symbol>
      <symbol id="c-dots" viewBox="0 0 24 24"><path d="M6 12h.01M12 12h.01M18 12h.01" /></symbol>
      <symbol id="c-wallet" viewBox="0 0 24 24"><path d="M5 9V7.5A1.5 1.5 0 0 1 6.5 6H17v3" /><rect x="4" y="9" width="16" height="10.5" rx="2" /><path d="M15.5 14.25h1" /></symbol>
      <symbol id="c-coins" viewBox="0 0 24 24"><ellipse cx="10" cy="7" rx="5.5" ry="2.5" /><path d="M4.5 7v4c0 1.4 2.5 2.5 5.5 2.5s5.5-1.1 5.5-2.5V7" /><path d="M8 16c.8.9 2.4 1.5 4.5 1.5 3 0 5.5-1.1 5.5-2.5v-4c0-.9-1-1.7-2.5-2.1" /></symbol>
      <!-- Самолёты: свой рисунок, раскраска-намёк (белый корпус, красный хвост), без логотипов -->
      <symbol id="p-side" viewBox="0 0 240 64">
        <path d="M22 33 L30 34 H62 L28 38 Z" fill="var(--jet-wing)" />
        <path d="M24 30 L11 5 H25 L50 27 Z" fill="var(--livery-red)" />
        <path d="M18 31 Q24 26 42 26 H190 Q220 26 234 36 Q222 42 196 42 H46 Q28 42 18 31 Z" fill="var(--jet-body)" />
        <path d="M46 40 H196 Q214 40 226 38.5 Q214 42 196 42 H46 Q36 42 30 39 Z" fill="var(--jet-belly)" />
        <path d="M213 30 L224 31.5 L222.5 34 L211 33 Z" fill="var(--jet-cockpit)" />
        <g fill="var(--jet-window)">
          <circle cx="62" cy="31.5" r="1.3" /><circle cx="69" cy="31.5" r="1.3" /><circle cx="76" cy="31.5" r="1.3" /><circle cx="83" cy="31.5" r="1.3" />
          <circle cx="90" cy="31.5" r="1.3" /><circle cx="97" cy="31.5" r="1.3" /><circle cx="104" cy="31.5" r="1.3" /><circle cx="111" cy="31.5" r="1.3" />
          <circle cx="118" cy="31.5" r="1.3" /><circle cx="125" cy="31.5" r="1.3" /><circle cx="132" cy="31.5" r="1.3" /><circle cx="139" cy="31.5" r="1.3" />
          <circle cx="146" cy="31.5" r="1.3" /><circle cx="153" cy="31.5" r="1.3" /><circle cx="160" cy="31.5" r="1.3" /><circle cx="167" cy="31.5" r="1.3" />
          <circle cx="174" cy="31.5" r="1.3" /><circle cx="181" cy="31.5" r="1.3" /><circle cx="188" cy="31.5" r="1.3" />
        </g>
        <path d="M150 37 L104 56 H118 L162 39 Z" fill="var(--jet-wing)" />
        <rect x="122" y="40" width="26" height="9" rx="4.5" fill="var(--jet-engine)" />
        <rect x="140" y="41.5" width="7" height="6" rx="3" fill="var(--jet-belly)" />
      </symbol>
      <symbol id="p-top" viewBox="0 0 120 140">
        <path d="M54 54 L4 82 V90 L54 78 Z M66 54 L116 82 V90 L66 78 Z" fill="var(--jet-wing)" />
        <path d="M4 82 V90 L9 88.6 V83.3 Z M116 82 V90 L111 88.6 V83.3 Z" fill="var(--livery-red)" />
        <ellipse cx="33" cy="72" rx="4.2" ry="9" fill="var(--jet-engine)" />
        <ellipse cx="87" cy="72" rx="4.2" ry="9" fill="var(--jet-engine)" />
        <path d="M54 116 L33 127 V132 L55 127 Z M66 116 L87 127 V132 L65 127 Z" fill="var(--jet-wing)" />
        <path d="M60 4 C66 4 68 14 68 26 V112 C68 124 64 133 60 136 C56 133 52 124 52 112 V26 C52 14 54 4 60 4 Z" fill="var(--jet-body)" />
        <path d="M60 4 C64 4 66 9 67 16 Q60 13 53 16 C54 9 56 4 60 4 Z" fill="var(--jet-belly)" />
        <path d="M55.5 13.5 Q60 11.5 64.5 13.5 L63.5 16.5 Q60 15.3 56.5 16.5 Z" fill="var(--jet-cockpit)" />
        <rect x="58.6" y="110" width="2.8" height="26" rx="1.4" fill="var(--livery-red)" />
      </symbol>
    </svg>

    <div class="sky" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span>
      <div class="flyby">
        <i class="contrail"></i><i class="contrail is-soft"></i>
        <svg class="liner" viewBox="0 0 240 64"><use href="#p-side" /><circle class="beacon" cx="120" cy="25" r="2.2" /><circle class="strobe" cx="12" cy="6" r="2" /></svg>
      </div>
    </div>

    <!-- Заставка: самолёт пролетает снизу вверх и утягивает небо, открывая главный экран -->
    <div class="intro" id="intro" aria-hidden="true">
      <div class="intro-cover">
        <div class="intro-sky"></div>
        <p class="intro-word">Finkit</p>
        <div class="intro-plane">
          <i class="trail t-left"></i><i class="trail t-right"></i>
          <svg class="jet-shadow" viewBox="0 0 120 140"><use href="#p-top" /></svg>
          <svg class="jet" viewBox="0 0 120 140"><use href="#p-top" /><circle class="nav nav-red" cx="5" cy="86" r="2" /><circle class="nav nav-green" cx="115" cy="86" r="2" /></svg>
        </div>
      </div>
    </div>

    <div id="app" class="app"></div>

    <nav class="tabbar" id="tabbar" aria-label="Разделы"></nav>

    <div class="sheet-layer" id="sheet-layer" hidden>
      <div class="sheet-scrim" data-action="close-sheet"></div>
      <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script src="app.js"></script>
  </body>
</html>
