<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Finkit</title>
    <meta name="description" content="Finkit — личные финансы: бюджет, цели и долги в одном месте" />
    <meta name="theme-color" content="#dce7f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121a26" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Finkit" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <link rel="preload" href="fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Тема ставится до отрисовки, чтобы ночью экран не мигал светлым
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('finkit:v1') || '{}');
          if (saved.theme === 'light' || saved.theme === 'dark') {
            document.documentElement.setAttribute('data-theme', saved.theme);
          }
          if (saved.lang === 'en') document.documentElement.lang = 'en';
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <!-- Иконки: один набор, линия 1.75, скруглённые концы -->
    <svg class="sprite" aria-hidden="true" focusable="false">

      <symbol id="i-overview" viewBox="0 0 24 24"><path d="M4 20h16" /><path d="M7 16v-5M12 16V7M17 16v-8" /></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-goals" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><circle cx="12" cy="12" r="4" /><path d="M12 12h.01" /></symbol>
      <symbol id="i-debts" viewBox="0 0 24 24"><path d="M4 9.5 12 5l8 4.5" /><path d="M6 10.5v6.5M10 10.5v6.5M14 10.5v6.5M18 10.5v6.5" /><path d="M4 19.5h16" /></symbol>

      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" /></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><path d="M14.5 5.5 8 12l6.5 6.5" /></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="m9.5 5.5 6.5 6.5-6.5 6.5" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" /></symbol>
      <symbol id="i-plane" viewBox="0 0 24 24"><path d="M20.5 12c0-.75-.6-1.25-1.4-1.25h-4.3L10.5 4.5H8.7l2.1 6.25H6.6L5 8.7H3.6l.9 3.3-.9 3.3H5l1.6-2.05h4.2L8.7 19.5h1.8l4.3-6.25h4.3c.8 0 1.4-.5 1.4-1.25z" /></symbol>

      <symbol id="i-note" viewBox="0 0 24 24"><path d="M5 19h3.5L19 8.5 15.5 5 5 15.5z" /><path d="m13.5 7 3.5 3.5" /></symbol>
      <symbol id="i-in" viewBox="0 0 24 24"><path d="M17 7 7 17" /><path d="M7 9v8h8" /></symbol>

      <symbol id="c-cart" viewBox="0 0 24 24"><path d="M3.5 5h2l2 10h10l2-7H7" /><circle cx="9.5" cy="19" r="1.3" /><circle cx="16.5" cy="19" r="1.3" /></symbol>
      <symbol id="c-cup" viewBox="0 0 24 24"><path d="M5 9.5h11v4.5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z" /><path d="M16 11h1.25a2.5 2.5 0 0 1 0 5H16" /><path d="M9 3.5c-.8 1 .8 2 0 3.5M12.5 3.5c-.8 1 .8 2 0 3.5" /></symbol>

      <symbol id="c-phone" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2.5" /><path d="M11 17.5h2" /></symbol>
      <symbol id="c-heart" viewBox="0 0 24 24"><path d="M12 19.5s-7.5-4.4-7.5-10A4 4 0 0 1 12 7.2a4 4 0 0 1 7.5 2.3c0 5.6-7.5 10-7.5 10z" /></symbol>
      <symbol id="c-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z" /><path d="M9 10V7a3 3 0 0 1 6 0v3" /></symbol>
      <symbol id="c-ticket" viewBox="0 0 24 24"><path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z" /><path d="M14 8.5v1.5M14 11.25v1.5M14 14v1.5" /></symbol>
      <symbol id="c-suitcase" viewBox="0 0 24 24"><rect x="4" y="7.5" width="16" height="12" rx="2" /><path d="M9 7.5v-2h6v2M9 7.5v12M15 7.5v12" /></symbol>
      <symbol id="c-transfer" viewBox="0 0 24 24"><path d="M5 8.5h13l-3-3M19 15.5H6l3 3" /></symbol>
      <symbol id="c-bank" viewBox="0 0 24 24"><path d="M4 9.5 12 5l8 4.5" /><path d="M6 10.5v6.5M10 10.5v6.5M14 10.5v6.5M18 10.5v6.5" /><path d="M4 19.5h16" /></symbol>
      <symbol id="c-dots" viewBox="0 0 24 24"><path d="M6 12h.01M12 12h.01M18 12h.01" /></symbol>

    </svg>

    <div class="sky" aria-hidden="true"><span></span><span></span><span></span></div>

    <div id="app" class="app"></div>

    <nav class="tabbar" id="tabbar" aria-label="Разделы"></nav>

    <div class="sheet-layer" id="sheet-layer" hidden>
      <div class="sheet-scrim" data-action="close-sheet"></div>
      <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script src="app.js"></script>
  </body>
</html>
